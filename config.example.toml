# Copy to config.toml (gitignored) and adjust locally.

[workspace]
# Root of per-episode workspaces: <dir>/<episode_id>/. Relative paths resolve
# against the current working directory.
dir = "work"

[ingest]
# yt-dlp format selector for YouTube sources (best video + best audio, merged to mp4).
youtube_format = "bv*+ba/b"
# JavaScript runtimes yt-dlp may use for YouTube challenges; must be on PATH.
js_runtimes = ["node"]

[transcript]
# Provider order is fixed: youtube caption -> local subtitle -> faster-whisper.
# The first transcript that passes validation wins; later providers are not called.
language = "vi"
# Acceptance thresholds (docs/decisions/CP3-transcript-contract.md T5).
min_vietnamese_ratio = 0.3   # share of words with Vietnamese-specific letters
min_coverage = 0.5           # speech seconds / video duration
min_words_per_minute = 30    # words / video minutes

[transcript.providers]
# Config can only disable a provider, not reorder them.
youtube = true
local_subtitle = true
whisper = true

[transcript.whisper]
model = "large-v3-turbo"
device = "cpu"
compute_type = "int8"
vad_filter = true
word_timestamps = true
# Execution-only (not part of the config hash): CPU threads (0 = all CPUs) and model cache dir.
cpu_threads = 0
models_dir = "models"

[analysis]
# Shot / silence detection and deterministic candidates
# (docs/decisions/CP4-analysis-contract.md). Changing any key re-runs the whole stage.
scene_threshold = 0.3        # ffmpeg select=gt(scene, threshold)
scale_width = 320            # frames are downscaled to this width before scene detection
silence_noise_db = -45       # ffmpeg silencedetect noise level (dB)
silence_min = 0.3            # minimum silence length (s)
min_boundary_silence = 3.0   # silence >= this, aligned with a caption segment start, is a cut point
align_tolerance = 0.5        # caption vs audio timestamp tolerance (s)
hard_break_silence = 10.0    # silence >= this is a hard break (never inside a candidate)
max_pause = 1.0              # silences longer than this are shortened to this in the Short (CP7)
boundary_pad = 0.3           # keep this much of the boundary silence at each clip edge (s)
min_duration = 30            # Short duration after silence trimming (s)
max_duration = 180
target_min = 60              # in_target range (informational)
target_max = 90
shot_guard = 1.0             # no shot change within this many seconds of a clip edge
intro_window = 60            # intro music label must start before this (s)
intro_min_silence = 1.0      # silence after the intro that marks the content start (s)
outro_window = 180           # outro music label must end within this many seconds of the end

[selection]
# AI clip selection via Ollama (docs/decisions/CP5-selection-contract.md).
# Changing any key below except ollama_host/timeout re-runs the stage.
model = "qwen3:30b"          # chosen by HUMAN LEAD 2026-09-26 (CP1 §11)
think = true                 # model "thinking" mode (qwen3); ~9k thinking tokens per window
temperature = 0
seed = 42
num_ctx = 32768              # Ollama context window (tokens): prompt (~3k) + thinking + answer
prompt_version = "v3"        # prompt text lives in code (selection/prompt.py); "v1", "v2" kept for comparison
max_clips = 25               # at most this many Shorts per episode (CP1 §5)
min_score = 7                # keep AI proposals with score >= this (1-10)
max_window_words = 2500      # longer windows are split into overlapping sub-windows
retries = 2                  # extra attempts per window on HTTP/timeout/JSON/schema errors
# B11 head cut: pure connectors at the very start of a clip (first words of its first caption
# segment, whole words, case-insensitive) are cut using word timing; the clip then starts at the
# silence before the first kept word (or that word's start) minus head_cut_pad. Empty list = off.
head_cut_words = ["cho nên", "vì vậy", "thế nên", "thế là", "do đó", "và", "nhưng", "mà", "rồi", "còn", "thì"]
head_cut_pad = 0.1           # seconds kept before the first kept word
# Execution-only (not part of the config hash). Env OLLAMA_HOST overrides ollama_host.
ollama_host = "http://127.0.0.1:11437"
timeout = 600                # seconds per Ollama request
retry_backoff = [5, 15]      # seconds to wait before retry 1, 2 (the last value repeats for more retries)

[titling]
# Header (deterministic) + AI title per selected clip via Ollama
# (docs/decisions/CP6-titling-contract.md). Changing any key below except
# ollama_host/timeout/retry_backoff re-runs the stage (and so does a different resolved header).
model = "qwen3:14b"          # chosen by HUMAN LEAD 2026-09-26 with prompt v2 (CP1 §11)
think = false                # thinking off (~3 s per clip)
temperature = 0
seed = 42
num_ctx = 16384
prompt_version = "v2"        # prompt text lives in code (titling/prompt.py); "v1" kept for comparison
n_options = 3                # the model proposes this many titles per clip, best first
min_chars = 10               # title length limits (characters, NFC)
max_chars = 60               # CP1 §6; titles longer than ~35 chars may take 3 lines / smaller font (CP7)
retries = 2                  # extra attempts per clip on HTTP/timeout/JSON/schema errors or no valid option
# Execution-only (not part of the config hash). Env OLLAMA_HOST overrides ollama_host.
ollama_host = "http://127.0.0.1:11437"
timeout = 600                # seconds per Ollama request
retry_backoff = [5, 15]      # seconds to wait before retry 1, 2 (the last value repeats)

[titling.header]
# Each field: CLI flag (--speaker/--series/--episode) > this value (non-empty) > the named group
# of the first title_patterns entry that matches the video title (metadata.json; no group mixing)
# > the "Tên bộ kinh" set on the web page of a bộ kinh listing the video (only when no pattern
# matches). Empty string = not set.
speaker = "HT.Tịnh Không"
series = ""
episode = ""
# Regexes tried in order ([] = off). The legacy key title_pattern = '<one regex>' ("" = off) is still
# accepted instead (not both).
title_patterns = [
  '^(?:Phật Thuyết\s+)?(?P<series>.+?)\s+tập\s+(?P<episode>\d+)\b',
  '^Tập\s+(?P<episode>\d+)(?:\s*/\s*\d+)?\s*:\s*(?:Giảng\s+)?["“](?P<series>[^"”]+?)\s*["”]',
]
# 1-3 header lines; fields {speaker}, {series}, {episode}. A field used here must resolve.
lines = ["{speaker}", "{series} (tập {episode})"]

[render]
# Short composition / renderer (docs/decisions/CP7-render-contract.md; layout CP1 §4, V16 of CP8.14).
# Frame 1080x1920; ratios below are fractions of the frame width W. Header at the top, video right below
# it, title panel floating over the bottom of the video (bottom edge at title_bottom, clear of the YouTube
# Shorts channel row). Changing any key below except output_dir/threads re-renders every Short.
title_source = "titles"              # auto-approve: AI titles from titles.json (only value until CP9 review)
font_file = "fonts/BeVietnamPro-Regular.ttf"   # OFL font inside the auto_short.render package
header_panel_width = 0.85
header_panel_height = 0.17           # fixed
video_height = 1.16                  # source scaled to fill W x 1.16 W and centre-cropped
title_panel_width = 0.75
title_panel_height = 0.21            # minimum: grows upwards for a 3rd title line before the font shrinks
                                     # (max = 3 lines at title_font_size, derived, not a key)
title_bottom = 1.4815                # 1600 px: bottom edge of the title panel
gap_header_video = 0.005
panel_radius = 0.055
min_frame_margin = 0.02              # top margin of the header panel
header_font_size = 0.045             # 49 px
title_font_size = 0.065              # 70 px
line_spacing = 1.05                  # baseline pitch / font size
panel_padding_x = 0.03               # text inset inside a panel, horizontal
panel_padding_y = 0.035              # and vertical
min_font_scale = 0.6                 # text needing a smaller font than this x the reference size fails
crf = 22                             # libx264 quality (lower = better, larger files; 18 ≈ 1.7x size)
preset = "medium"
audio_bitrate = "192k"               # AAC 48 kHz stereo
dissolve = 0.15                      # s, video dissolve at silence-trim junctions (audio stays a hard cut); 0 = hard cut
# Execution-only (not part of the config hash):
output_dir = "output"                # Shorts go to <output_dir>/<episode_id>/
threads = 0                          # ffmpeg/x264 threads; 0 = automatic

[web]
# Web MVP: `auto-short web` (docs/decisions/CP8.3-web-contract.md). Execution-only (no stage uses it).
# The password comes from the environment variable AUTO_SHORT_WEB_PASSWORD (never from this file).
host = "0.0.0.0"                     # listen on the LAN; "127.0.0.1" = this machine only
port = 8080
session_days = 30                    # login cookie lifetime (days)
# Hashtags added after the title by the "Copy" button (after #<series>; "#" optional; spaces / punctuation dropped;
# dropped from the end when title + tags exceed 100 characters).
hashtags = ["TịnhKhông", "LờiPhậtDạy", "TịnhĐộ", "NiệmPhật"]
# Job queue (CP8.10): "lanes" = ingest/transcript/analysis, AI (selection/titling) and render of different videos
# run at the same time (one job per lane); "serial" = one video through all six stages at a time.
queue_mode = "lanes"

[khaithi]
# Khai thị videos: `auto-short run <url> --khai-thi --min-minutes N --max-minutes M` / web "Khai thị"
# (docs/decisions/CP8.9-khai-thi-contract.md). Same 9:16 template as a Short, one complete teaching per video,
# length in [min, max] minutes after silence trimming, in the separate episode <id>.kt.
# Execution-only: the defaults and the limit (only the effective values below reach the config hash).
default_min_minutes = 4
default_max_minutes = 7
max_minutes_limit = 15               # at most 15 (longer videos are out of scope)
# Effective for a khai thị episode (config hash of selection): prompt and window size
prompt_version = "kt2"               # selection prompt of khai thị episodes (text in selection/prompt.py; kt1 kept)
window_words_per_minute = 400        # window = max([selection] max_window_words, this x max minutes)
# Effective for a khai thị episode (config hash of analysis): a caption label such as [âm nhạc] no longer than this
# (seconds) is a pause, not a hard break, so a khai thị video may run across it (Shorts are unchanged)
soft_label_max_seconds = 5.0

[learning]
# Chinese Learning: `auto-short learn <url>` (docs/decisions/CL1-chinese-learning-contract.md).
# Artifacts go to <workspace dir>/_learning/<video id>/.
window_seconds = 300.0               # only the first N seconds: subtitle segments with start < N, and the clip
min_han_ratio = 0.5                  # Han characters / letters of the window's subtitle text (below -> rejected)
media_format = "bv*[height<=720]+ba/b[height<=720]"  # yt-dlp format of clip.mp4 (only [0, N] is downloaded)
# Stage `lesson` (C7): Pinyin + Vietnamese meaning per subtitle line via Ollama -> lesson.json.
# Changing any key below except ollama_host/timeout/retries/retry_backoff re-runs the stage.
model = "qwen3:14b"          # proposed; not final until HUMAN LEAD reviews a real sample (G6)
think = false
temperature = 0
seed = 42
num_ctx = 8192
prompt_version = "v1"        # prompt text lives in code (learning/prompt.py)
batch_lines = 20             # subtitle lines per Ollama request
# Execution-only (not part of the config hash). Env OLLAMA_HOST overrides ollama_host.
retries = 2                  # extra attempts per batch on HTTP/timeout/JSON/validation errors
ollama_host = "http://127.0.0.1:11437"
timeout = 600                # seconds per Ollama request
retry_backoff = [5, 15]      # seconds to wait before retry 1, 2 (the last value repeats)
