# Copy to config.toml (gitignored) and adjust locally.

[workspace]
# Root of per-episode workspaces: <dir>/<episode_id>/. Relative paths resolve
# against the current working directory.
dir = "work"

[ingest]
# yt-dlp format selector for YouTube sources (best video + best audio, merged to mp4).
youtube_format = "bv*+ba/b"
# JavaScript runtimes yt-dlp may use for YouTube challenges; must be on PATH.
js_runtimes = ["node"]

[transcript]
# Provider order is fixed: youtube caption -> local subtitle -> faster-whisper.
# The first transcript that passes validation wins; later providers are not called.
language = "vi"
# Acceptance thresholds (docs/decisions/CP3-transcript-contract.md T5).
min_vietnamese_ratio = 0.3   # share of words with Vietnamese-specific letters
min_coverage = 0.5           # speech seconds / video duration
min_words_per_minute = 30    # words / video minutes

[transcript.providers]
# Config can only disable a provider, not reorder them.
youtube = true
local_subtitle = true
whisper = true

[transcript.whisper]
model = "large-v3-turbo"
device = "cpu"
compute_type = "int8"
vad_filter = true
word_timestamps = true
# Execution-only (not part of the config hash): CPU threads (0 = all CPUs) and model cache dir.
cpu_threads = 0
models_dir = "models"

[analysis]
# Shot / silence detection and deterministic candidates
# (docs/decisions/CP4-analysis-contract.md). Changing any key re-runs the whole stage.
scene_threshold = 0.3        # ffmpeg select=gt(scene, threshold)
scale_width = 320            # frames are downscaled to this width before scene detection
silence_noise_db = -45       # ffmpeg silencedetect noise level (dB)
silence_min = 0.3            # minimum silence length (s)
min_boundary_silence = 3.0   # silence >= this, aligned with a caption segment start, is a cut point
align_tolerance = 0.5        # caption vs audio timestamp tolerance (s)
hard_break_silence = 10.0    # silence >= this is a hard break (never inside a candidate)
max_pause = 1.0              # silences longer than this are shortened to this in the Short (CP7)
boundary_pad = 0.3           # keep this much of the boundary silence at each clip edge (s)
min_duration = 30            # Short duration after silence trimming (s)
max_duration = 180
target_min = 60              # in_target range (informational)
target_max = 90
shot_guard = 1.0             # no shot change within this many seconds of a clip edge
intro_window = 60            # intro music label must start before this (s)
intro_min_silence = 1.0      # silence after the intro that marks the content start (s)
outro_window = 180           # outro music label must end within this many seconds of the end

[selection]
# AI clip selection via Ollama (docs/decisions/CP5-selection-contract.md).
# Changing any key below except ollama_host/timeout re-runs the stage.
model = "qwen3:14b"
think = false                # model "thinking" mode (qwen3)
temperature = 0
seed = 42
num_ctx = 16384              # Ollama context window (tokens)
prompt_version = "v2"        # prompt text lives in code (selection/prompt.py); "v1" kept for comparison
max_clips = 25               # at most this many Shorts per episode (CP1 §5)
min_score = 7                # keep AI proposals with score >= this (1-10)
max_window_words = 2500      # longer windows are split into overlapping sub-windows
retries = 2                  # extra attempts per window on HTTP/timeout/JSON/schema errors
# Execution-only (not part of the config hash). Env OLLAMA_HOST overrides ollama_host.
ollama_host = "http://127.0.0.1:11435"
timeout = 600                # seconds per Ollama request
