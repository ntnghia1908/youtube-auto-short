[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-short"
version = "0.1.0"
description = "Turn Vietnamese long-form lecture videos into YouTube Shorts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned: last version verified against YouTube. Bump via a new task when YouTube changes.
    "yt-dlp==2026.8.19",
    # Whisper fallback for transcripts (CP3, docs/decisions/CP3-transcript-contract.md T4).
    "faster-whisper==1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # TestClient for the web tests (CP8.3); already a transitive dependency of the env.
    "httpx",
]
# Web MVP `auto-short web` (CP8.3, docs/decisions/CP8.3-web-contract.md): pip install -e ".[dev,web]".
web = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[project.scripts]
auto-short = "auto_short.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_short"]

[tool.pytest.ini_options]
testpaths = ["tests"]
