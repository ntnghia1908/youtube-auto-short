<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem chung — Auto Short</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/watch.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/">← Auto Short</a></header>
<main id="watch-room" class="container watch-room">
  <h1>Xem chung</h1>
  <h2 id="watch-title">Chưa có phòng xem chung</h2>
  <p id="watch-viewers">Đang xem: 0 người</p>
  <p id="watch-message" role="status" aria-live="polite"></p>
  <video id="watch-video" controls playsinline preload="metadata" hidden></video>
  <button id="watch-play" class="btn primary" type="button" hidden>Bấm để phát</button>
  <div class="actions">
    <button id="watch-prev" class="btn" type="button" disabled>Trước</button>
    <button id="watch-next" class="btn" type="button" disabled>Tiếp</button>
    <label>Tốc độ <select id="watch-rate" disabled aria-label="Tốc độ phát">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option><option value="1" selected>1×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option><option value="2">2×</option>
      <option value="3">3×</option><option value="4">4×</option>
    </select></label>
    <button id="watch-end" class="btn danger" type="button" disabled>Kết thúc xem chung</button>
  </div>
  <ol id="watch-queue" class="watch-queue" aria-label="Danh sách phát"></ol>
</main>
</body>
</html>
