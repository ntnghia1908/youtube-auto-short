<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail cả bộ — Auto Short</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* PKG2.1: action bar always visible, compact picker, collapsed lists (phone first) */
  .th-bar { position: sticky; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--border);
    margin: 1rem -.75rem -.75rem; padding: .6rem .75rem calc(.6rem + env(safe-area-inset-bottom)); box-shadow: 0 -2px 6px rgba(0, 0, 0, .08); }
  .th-bar .actions { margin: 0; }
  .th-bar p { margin: .35rem 0 0; }
  .th-look { border: 1px solid var(--border); border-radius: 8px; padding: .6rem; margin: .75rem 0; }
  .th-look legend { padding: 0 .3rem; }
  .th-picked { display: flex; align-items: center; gap: .6rem; min-height: 56px; }
  .th-picked img { width: 48px; height: 48px; object-fit: contain; background: #eee; border-radius: 6px; }
  .th-assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; max-height: 50vh; overflow: auto; padding: 4px; }
  .th-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-top: .6rem; }
  .th-check { display: flex; align-items: center; gap: .5rem; min-height: 44px; }
  #thumbs-bar { width: 100%; }
  .th-reasons { margin: .25rem 0 0; padding-left: 1.2rem; }
  /* Form: label above, full-width control below; one font / height for every control */
  #thumbs-settings { max-width: 720px; }
  #thumbs-settings label.th-field { display: grid; gap: .3rem; margin: .9rem 0 0; }
  .th-hint { font-weight: 400; font-size: .85rem; color: var(--muted); }
  #thumbs-settings select, #thumbs-settings textarea, #thumbs-settings input[type="text"] {
    width: 100%; box-sizing: border-box; min-height: 44px; padding: .6rem .7rem; font: inherit; font-weight: 400;
    color: var(--text); background: #fff; border: 1px solid var(--border); border-radius: 8px; }
  #thumbs-settings textarea { min-height: 5.5rem; resize: vertical; line-height: 1.4; }
  #thumbs-settings select:focus, #thumbs-settings textarea:focus, #thumbs-settings input[type="text"]:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  .th-range { display: flex; align-items: center; gap: .6rem; min-height: 44px; }
  .th-range input[type="range"] { flex: 1; width: auto; padding: 0; border: 0; }
  .th-range output { min-width: 3rem; text-align: right; font-variant-numeric: tabular-nums; font-weight: 400; }
  .th-look { display: grid; gap: .5rem; }
  .th-look label.th-field { margin-top: .3rem; }
  .th-look summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
  .th-check input { width: 1.4rem; height: 1.4rem; margin: 0; }
  .th-bar .actions { flex-wrap: wrap; }
  .th-bar .btn { min-height: 44px; }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/">&larr; Auto Short</a>
<form method="post" action="/logout"><button class="btn link" type="submit">Đăng xuất</button></form></header>
<main class="container">
<section class="card">
<a id="thumbs-back" href="/">&larr; Về bộ kinh</a>
<h2 id="thumbs-title">Thumbnail cả bộ</h2>
<form id="thumbs-settings">
<label class="th-field"><span>Kiểu</span>
<select id="thumbs-style">
<option value="A">A — Nền tối, chữ vàng serif</option>
<option value="B">B — Viền vàng, chữ trắng Anton</option>
<option value="C">C — Nền giấy thủy mặc, chữ nâu</option>
</select></label>
<label class="th-field"><span>Các dòng tiêu đề</span>
<span class="th-hint">1–3 dòng, tối đa 40 ký tự mỗi dòng</span>
<textarea id="thumbs-lines" rows="3" aria-label="Các dòng tiêu đề"></textarea></label>
<label class="th-field"><span>Người giảng / credit</span> <input id="thumbs-credit" type="text" maxlength="60"></label>
<fieldset class="th-look"><legend>Ảnh dùng chung cho cả bộ</legend>
<div id="thumbs-picked" class="th-picked"></div>
<details id="thumbs-details"><summary>Đổi ảnh</summary>
<div id="thumbs-assets" class="th-assets"></div></details>
<label class="th-field"><span>Vị trí lấy ảnh</span>
<span class="th-range"><input id="thumbs-focus" type="range" min="0" max="1" step="0.01" value="0.5">
<output id="thumbs-focus-value">0.50</output></span></label>
</fieldset>
<label class="th-check"><input id="thumbs-vsep" type="checkbox"> Bản dọc dùng kiểu riêng</label>
<fieldset id="thumbs-vgroup" class="th-look" hidden><legend>Kiểu riêng cho bản dọc 9:16</legend>
<label class="th-field"><span>Kiểu</span>
<select id="thumbs-vstyle">
<option value="A">A — Nền tối, chữ vàng serif</option>
<option value="B">B — Viền vàng, chữ trắng Anton</option>
<option value="C">C — Nền giấy thủy mặc, chữ nâu</option>
</select></label>
<div id="thumbs-vpicked" class="th-picked"></div>
<details id="thumbs-vdetails"><summary>Đổi ảnh</summary>
<div id="thumbs-vassets" class="th-assets"></div></details>
<label class="th-field"><span>Vị trí lấy ảnh</span>
<span class="th-range"><input id="thumbs-vfocus" type="range" min="0" max="1" step="0.01" value="0.5">
<output id="thumbs-vfocus-value">0.50</output></span></label>
</fieldset>
<div id="thumbs-preview-images" class="actions" style="align-items:flex-start"></div>
<p id="thumbs-msg" class="small" role="status"></p>
<div id="thumbs-progress-box">
<p id="thumbs-progress" role="status">Chưa có số liệu</p>
<progress id="thumbs-bar" hidden></progress>
<ul id="thumbs-reasons" class="th-reasons small muted"></ul>
<button id="thumbs-refresh" class="btn small" type="button" data-keep>Tải lại trạng thái</button>
</div>
<details id="thumbs-episodes"><summary>Xem từng tập</summary>
<div id="thumbs-grid" class="th-grid"></div></details>
<div class="th-bar">
<div class="actions">
<button id="thumbs-preview" class="btn" type="button">Xem trước</button>
<button id="thumbs-build" class="btn primary" type="submit" style="margin-top:0">Dựng cả bộ</button>
<a id="thumbs-zip" class="btn" download>Tải zip</a>
</div>
<p id="thumbs-status" class="small" role="status"></p>
</div>
</form>
</section>
</main>
<script src="/static/app.js"></script>
<script src="/static/thumbs.js"></script>
</body>
</html>
