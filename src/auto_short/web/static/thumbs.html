<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail cả bộ — Auto Short</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.th-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.th-grid img { display: block; width: 100%; max-height: 560px; object-fit: contain; background: #182120; cursor: zoom-in; }
.th-bar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: .8rem; z-index: 5; }
#thumbs-notes, #thumbs-feedback { display: block; width: 100%; box-sizing: border-box; margin: .5rem 0; font: inherit; }
#thumbs-bar { width: 100%; }
dialog { width: min(95vw, 1300px); max-width: 95vw; padding: .5rem; }
dialog img { display: block; max-width: 100%; max-height: 85vh; margin: auto; }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/">&larr; Auto Short</a>
<form method="post" action="/logout"><button class="btn link" type="submit">Đăng xuất</button></form></header>
<main class="container"><section class="card">
<a id="thumbs-back" href="/">&larr; Về bộ kinh</a>
<h2 id="thumbs-title">Thumbnail cả bộ</h2>
<h3>Ảnh bìa đang dùng</h3><div id="thumbs-covers" class="th-grid"></div>
<button id="thumbs-suggest-kt" class="btn" type="button" hidden>Vẽ ảnh khai thị theo bìa hiện tại</button>
<h3>Chọn ảnh bìa mới</h3>
<label for="thumbs-notes">Ghi chú phong cách (tùy chọn)</label>
<textarea id="thumbs-notes" maxlength="200" rows="2" placeholder="Ví dụ: hoa sen vàng, nền xanh ngọc"></textarea>
<div class="actions"><button id="thumbs-suggest" class="btn primary" type="button">Gợi ý 4 mẫu</button>
<button id="thumbs-cancel" class="btn" type="button" hidden>Hủy</button></div>
<p id="thumbs-suggest-status" role="status"></p>
<p class="small muted">Bấm ảnh để phóng to. Kiểm tra dấu tiếng Việt trước khi chọn.</p>
<div id="thumbs-feedback-panel" hidden>
<label for="thumbs-feedback">Góp ý cho Codex</label>
<textarea id="thumbs-feedback" maxlength="300" rows="3" placeholder="Ví dụ: thu nhỏ khung TẬP, thêm hoa sen"></textarea>
<button id="thumbs-feedback-options" class="btn" type="button">Vẽ lại 4 mẫu theo góp ý</button></div>
<div id="thumbs-feedback-history" hidden><p>Góp ý đã áp dụng</p><ul id="thumbs-feedback-list"></ul></div>
<div id="thumbs-options" class="th-grid"></div>
<div id="thumbs-previews" class="th-grid"></div>
<div id="thumbs-accept" class="actions" hidden>
<button id="thumbs-install" class="btn primary" type="button">Dùng bộ ảnh này</button>
<button id="thumbs-redraw" class="btn" type="button">Vẽ lại 3 ảnh</button>
<button id="thumbs-feedback-variants" class="btn" type="button">Vẽ lại 3 ảnh theo góp ý</button>
<button id="thumbs-again" class="btn" type="button">Gợi ý lại</button></div>
<p id="thumbs-msg" role="status"></p>
<details id="thumbs-episodes"><summary>Xem từng tập</summary><div id="thumbs-grid" class="th-grid"></div></details>
<div class="th-bar"><div class="actions">
<button id="thumbs-build" class="btn primary" type="button">Dựng cả bộ</button>
<a id="thumbs-zip" class="btn" download>Tải zip</a>
<button id="thumbs-refresh" class="btn" type="button">Tải lại trạng thái</button></div>
<p id="thumbs-progress" role="status"></p><progress id="thumbs-bar" hidden></progress>
<p id="thumbs-status" class="small" role="status"></p></div>
</section></main>
<dialog id="thumbs-zoom"><button id="thumbs-close" class="btn" type="button">Đóng</button><img alt="Ảnh phóng to"></dialog>
<script src="/static/app.js"></script><script src="/static/thumbs.js"></script>
</body></html>
