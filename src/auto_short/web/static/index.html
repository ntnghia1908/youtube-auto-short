<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Short</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Auto Short</a>
  <form method="post" action="/logout"><button class="btn link" type="submit">Đăng xuất</button></form>
</header>
<main class="container">
  <section class="card">
    <h2>Tạo Short từ video YouTube</h2>
    <form id="submit-form" autocomplete="off">
      <label for="url">Link video YouTube</label>
      <input id="url" name="url" type="url" inputmode="url" required
             placeholder="https://youtu.be/… hoặc https://www.youtube.com/watch?v=…">
      <details>
        <summary>Tuỳ chọn header (khi tên video không theo mẫu “… tập N”)</summary>
        <div class="row">
          <div><label for="series">Bộ kinh / series</label><input id="series" name="series" maxlength="100"></div>
          <div><label for="episode">Tập</label><input id="episode" name="episode" maxlength="100" inputmode="numeric"></div>
        </div>
      </details>
      <p id="submit-error" class="error" hidden></p>
      <button id="submit-btn" type="submit" class="btn primary">Bắt đầu</button>
    </form>
  </section>
  <section class="card">
    <h2>Các video đã xử lý</h2>
    <ul id="episodes" class="episode-list"><li class="muted">Đang tải…</li></ul>
  </section>
</main>
<script src="/static/app.js"></script>
<script>AutoShort.initIndex();</script>
</body>
</html>
