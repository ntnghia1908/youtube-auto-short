<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode — Auto Short</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">&larr; Auto Short</a>
  <nav class="topnav"><a href="/storage">Bộ nhớ</a>
  <form method="post" action="/logout"><button class="btn link" type="submit">Đăng xuất</button></form></nav>
</header>
<div id="disk-banner" class="disk-banner" hidden></div>
<main class="container">
  <nav id="kind-bar" class="kind-bar" aria-label="Short / khai thị của video này">
    <span class="kind-btn">Shorts</span>
    <span class="kind-btn">Khai thị</span>
  </nav>
  <p id="kind-note" class="note small kind-note" role="status" hidden></p>
  <section class="card">
    <h2 id="ep-title">…</h2>
    <p id="ep-meta" class="muted small"></p>
    <details id="stages-box" class="stages-box" open>
      <summary><span id="job-status" class="job-status">Các bước xử lý</span></summary>
      <ol id="stages" class="stages"></ol>
    </details>
    <p id="archived-note" class="note small" hidden></p>
    <div class="actions">
      <button id="resubmit" class="btn" type="button" hidden>Chạy tiếp / chạy lại (bước đã xong được bỏ qua)</button>
      <button id="delete-episode" class="btn danger" type="button" hidden>Xóa tập này</button>
      <span id="delete-note" class="muted small" hidden>Đang có job chạy — đợi xong để xóa.</span>
    </div>
    <details id="kt-box" hidden>
      <summary id="kt-summary">Tạo video khai thị từ video này</summary>
      <div class="row even">
        <div><label for="kt-min">Dài từ (phút)</label><input id="kt-min" type="number" min="1" max="15" step="1" value="4" inputmode="numeric"></div>
        <div><label for="kt-max">Đến (phút)</label><input id="kt-max" type="number" min="1" max="15" step="1" value="7" inputmode="numeric"></div>
      </div>
      <button id="kt-create" class="btn" type="button">Tạo video khai thị</button>
      <p id="kt-error" class="error small" hidden></p>
    </details>
    <details id="log-box">
      <summary>Nhật ký xử lý</summary>
      <pre id="log" class="log"></pre>
    </details>
  </section>
  <section class="card">
    <div class="shorts-head">
      <h2><span id="shorts-label">Shorts</span> <span id="shorts-count" class="muted"></span></h2>
      <a id="zip" class="btn" hidden>Tải tất cả (.zip)</a>
    </div>
    <p id="header-lines" class="muted small"></p>
    <p id="shorts-note" class="note small" hidden></p>
    <div id="filters" class="filters" hidden>
      <button class="btn small" type="button" data-filter="all">Tất cả (<span class="n">0</span>)</button>
      <button class="btn small" type="button" data-filter="todo">Chưa đăng (<span class="n">0</span>)</button>
      <button class="btn small" type="button" data-filter="done">Đã đăng (<span class="n">0</span>)</button>
      <span id="published-count" class="muted small"></span>
      <button id="show-deleted" class="btn small link-dark" type="button" hidden></button>
    </div>
    <div id="shorts" class="shorts-grid"></div>
  </section>
</main>
<script src="/static/app.js"></script>
<script>AutoShort.initEpisode();</script>
</body>
</html>
